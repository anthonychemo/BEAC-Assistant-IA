# ============================================================
# Configuration du pipeline BEAC RAG
# Les secrets/chemins machine sont dans .env (voir .env.example)
# ============================================================

project:
  name: "BEAC RAG Chatbot"
  language: "fr"   # langue principale des reponses

# ---- Ingestion ----
ingestion:
  # Extensions traitees
  pdf_extensions: [".pdf"]
  excel_extensions: [".xls", ".xlsx"]
  # OCR : seuil de caracteres natifs en-dessous duquel on bascule en OCR
  ocr_text_threshold: 100
  ocr_dpi: 200           # 200 DPI suffit et 2x plus rapide
  ocr_workers: 4         # 0 = auto (cpu_count // 2). Parallelise l'OCR page par page.
  image_extract_dir: "data/extracted_images"  # ou null pour desactiver
  # Nombre de fichiers traites par lot (memoire)
  batch_size: 10

# ---- Chunking ----
chunking:
  chunk_size: 400       # tokens approx par chunk (moins de chunks)
  chunk_overlap: 90
  min_chunk_chars: 50    # ignore les chunks trop courts

# ---- Embeddings ----
embeddings:
  model: "BAAI/bge-m3"
  device: "cuda"
  dimension: 1024        # dimension de bge-m3
  batch_size: 64         # GPU (RTX 4060, 8 Go) : 64-128 possible sans OOM
  normalize: true

# ---- Vector store (pgvector) ----
vector_store:
  table: "chunks"
  index_type: "hnsw"     # hnsw (rapide) ou ivfflat
  hnsw_m: 16
  hnsw_ef_construction: 64
  distance: "cosine"     # cosine | l2 | ip

# ---- Retrieval ----
retrieval:
  top_k: 8              # chunks vectoriels retournes
  sql_max_rows: 50       # lignes max d'une requete SQL stats
  min_similarity: 0.45    # seuil de pertinence

# ---- LLM ----
llm:
  provider: "openrouter"
  model: "google/gemma-4-31b-it:free"   # modele gratuit, contexte 256K
  fast_model: null                       # pas de modele rapide distinct pour l'instant
  fallback_model: "openai/gpt-oss-20b:free"  # bascule si le modele principal est rate-limite (autre fournisseur que Google AI Studio)
  # NB : openai/gpt-oss-120b:free a ete retire du catalogue gratuit OpenRouter
  # (bascule vers la version payante, 404) le 2026-07-19 ; remplace par la
  # variante 20b, toujours gratuite au moment de cette modification. Le
  # catalogue gratuit OpenRouter change frequemment (ajouts/retraits sans
  # preavis) : verifier https://openrouter.ai/api/v1/models si ce modele
  # venait a son tour a disparaitre.
  temperature: 0.1
  max_tokens: 1024

cache:
  max_size: 100
  ttl_seconds: 3600   # 1h — adapter selon la fraîcheur des données BEAC

# ---- Query router ----
router:
  # Mots-cles qui suggerent une question "donnees chiffrees" (-> SQL)
  data_keywords:
    - taux
    - inflation
    - masse monetaire
    - reserves
    - statistique
    - montant
    - valeur
    - evolution
    - combien
    - chiffre
    - pourcentage
    - balance
    - emission
