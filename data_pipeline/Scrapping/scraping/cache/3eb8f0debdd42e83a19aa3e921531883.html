		<script type="text/javascript" src="ps/mobile/js/mobilelaunch.js"></script><script type="text/javascript" src="ps/portal/js/productLanguages.js"></script>
		<script type="text/javascript">
var errorCount = 0;

			var g_mobileRedirect = (typeof window.mobilelaunch=="undefined") ? false : (!window.mobilelaunch.willRedirect())? false : true;
			
						
			function doOnLoad()
			{

				if(!g_mobileRedirect)
				{
					// IBM Cognos products - ps
					genSplashScreen();
				}
				else
				{
					// IBM Cognos products - mobile
					window.mobilelaunch.doRedirect();
				}
			}

			function defautImage(imageTag){
				errorCount++;
				//just make sure that we don't get into an infinite loop...if we can't load the default 
				//image then we don't want to try again forever
				if (errorCount < 2){
					imageTag.src = "ps/portal/images/splash/portal_splash_en.jpg";
				}
			}
 
			function getCurrentLocale(){
				var browserLocale = "";
				
				if (navigator.language){
					browserLocale = navigator.language;
				} else if (navigator.browserLanguage){
					browserLocale = navigator.browserLanguage;
				}

				return getProductLocale(browserLocale);
			}

			function getProductLocale(browserLocale){
				for (var index=0;index < defaultSupportedProductLocales.length;index++){
					if (defaultSupportedProductLocales[index] == browserLocale){
						return browserLocale;
					}
				}
				// try without the country section	
				if (browserLocale){			
					var index = browserLocale.indexOf("-");
					if (index != -1){
						return getProductLocale(browserLocale.substring(0, index));
					}
				}
				
				return "en";
			}

			function splashLoaded(img){
				img.style.visibility = "visible";
				window.setTimeout("window.location.replace('cgi-bin/cognosisapi.dll?b_action=xts.run&m=portal/main.xts&startwel=yes')",5);
			}
			
			function genSplashScreen()
			{
				var currrentLocale = getCurrentLocale();
				var imageSRC = "ps/portal/images/splash/portal_splash" + "_" + currrentLocale + ".jpg";
				var newHTML = '<div align="center"><img src="';
				newHTML += imageSRC;
				newHTML += '" onError="javascript:defautImage(this)" onLoad="javascript:splashLoaded(this)" style="position:relative; top:80px; visibility: hidden"/></div>';
				document.body.innerHTML = newHTML;
			}			

		</script>
	</head>
	<body style="background-color:#ffffff" onload="doOnLoad()"></body>
</html>
